events {
    worker_connections 1024;
}

http {
    # Include MIME types for proper content-type headers
    # This ensures JavaScript modules are served with application/javascript MIME type
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Explicitly set MIME type for JavaScript modules (mjs extension)
    # Note: js and css are already in mime.types, only adding mjs here
    types {
        application/javascript mjs;
    }
    
    upstream panel_backend {
        server api:5001 max_fails=3 fail_timeout=30s;
        # Uncomment to add more API instances for load balancing:
        # server api2:5001 max_fails=3 fail_timeout=30s;
        # server api3:5001 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Logging
    log_format structured_log '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"http_referer":"$http_referer","http_user_agent":"$http_user_agent","request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
    
    access_log /var/log/nginx/access.log structured_log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression - optimized for maximum compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 9; # Maximum compression level for better performance
    gzip_min_length 256; # Lower threshold to compress more files
    gzip_buffers 16 8k; # Buffer settings for better performance
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/xml+rss 
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;
    gzip_disable "msie6";
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strong HSTS policy (1 year with includeSubDomains and preload)
    # Note: HSTS is only set for HTTPS responses (see HTTPS server block)
    # COOP header is only set in HTTPS server block (line 123) because it requires secure context
    # COEP can break some third-party integrations, use "require-corp" only if needed
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    
    # Content Security Policy (CSP)
    # Strict CSP configuration optimized for production
    # Production: Vite generates hashed assets, allowing stricter policy
    # Development: Requires 'unsafe-inline' and 'unsafe-eval' for HMR
    # 
    # Policy breakdown:
    # - default-src 'self': Only allow resources from same origin
    # - script-src: Allow scripts from self, with nonce support for inline scripts (Vite production uses hashes)
    # - style-src: Allow styles from self and inline (needed for Vite, but can be improved with nonces)
    # - img-src: Allow images from self, data URIs, HTTPS, and blob (for user uploads)
    # - font-src: Allow fonts from self and data URIs
    # - connect-src: Allow API calls to self, HTTPS, and WebSocket connections
    # - frame-ancestors 'none': Prevent clickjacking
    # - upgrade-insecure-requests: Force HTTPS
    # - block-all-mixed-content: Block mixed HTTP/HTTPS content
    # - require-trusted-types-for 'script': Enable Trusted Types for XSS protection
    # Note: In production, Vite generates hashed assets, so 'unsafe-inline' can be removed for scripts
    # However, some third-party libraries may require it. Monitor CSP reports to optimize further.
    # For stricter CSP, consider using nonce-based approach or removing 'unsafe-inline' after testing
    # Content Security Policy - relaxed for debugging
    # TODO: Tighten after ensuring all scripts work correctly
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; style-src 'self' 'unsafe-inline' https: data:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'self' https:; worker-src 'self' blob:;" always;

    server {
        listen 80;
        server_name ovrin.xyz www.ovrin.xyz;
        
        # Health check endpoint (must be before redirect)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Let's Encrypt ACME challenge location
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        
        # Redirect HTTP to HTTPS (required for Lighthouse Best Practices)
        # But only after Let's Encrypt validation
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server (if SSL certificates are available)
    server {
        listen 443 ssl;
        http2 on;
        server_name ovrin.xyz www.ovrin.xyz;
        
        # HTTP/2 optimizations for better performance
        # Modern nginx uses these directives instead of deprecated http2_* directives
        large_client_header_buffers 4 32k;
        keepalive_requests 1000;
        client_header_timeout 20s;
        keepalive_timeout 3m;
        
        # Ensure HTTP/2 is used for all connections
        # This helps with Lighthouse "Use HTTP/2" audit
        
        # Note: COOP header is set only for HTML pages (in location / block)
        # to avoid warnings for static assets (JS, CSS, images)
        # COEP can break some third-party integrations, use "require-corp" only if needed
        # add_header Cross-Origin-Embedder-Policy "require-corp" always;
        
        # Allow large file uploads (up to 5GB for APK files)
        client_max_body_size 5G;

        # SSL configuration - optimized for performance
        # Let's Encrypt certificates (preferred, will be used if available)
        # Fallback to self-signed certificate if Let's Encrypt is not available
        # Note: Uncomment Let's Encrypt lines after running obtain_ssl_cert.sh
        # ssl_certificate /etc/letsencrypt/live/ovrin.xyz/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/ovrin.xyz/privkey.pem;
        # Temporary: using self-signed until Let's Encrypt certificates are obtained
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP stapling for better performance
        ssl_stapling on;
        ssl_stapling_verify on;

        # SECURITY: Mutual TLS (mTLS) Configuration
        # Enable mTLS by setting MTLS_ENABLED=true and providing CA certificate path
        # This requires client certificates for agent/client connections
        # 
        # IMPORTANT: Uncomment these lines AFTER creating the first project CA:
        # 1. Create CA for a project (will auto-create on first /api/projects/<id>/mtls/ca-cert request)
        # 2. Verify ca-bundle.pem exists and contains valid PEM certificates
        # 3. Uncomment the lines below
        #
        # ssl_client_certificate /etc/nginx/ssl/ca-bundle.pem;  # Project CA bundle generated by scripts/mtls_project.sh
        # ssl_verify_client optional;  # Accept client certificate if provided (on = required, optional = optional, off = disabled)
        # ssl_verify_depth 2;  # Maximum depth for certificate chain validation
        # 
        # Note: When mTLS is enabled, requests to /api/connect, /api/heartbeat, etc.
        # will require a valid client certificate signed by the CA.
        # Nginx will validate certificates when provided, and Flask middleware will enforce
        # certificate requirement for protected endpoints via @require_mtls decorator.

        # Same location blocks as HTTP server
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://panel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SECURITY: Pass client certificate information to Flask for mTLS validation
            # These headers are used by the mTLS middleware to validate client certificates
            # 
            # CRITICAL SECURITY: To prevent header spoofing attacks, we MUST:
            # 1. Clear any external X-SSL-Client-* headers first (prevents spoofing)
            # 2. Then set headers from Nginx SSL variables (trusted source)
            # 
            # Step 1: Clear external headers (CRITICAL - prevents spoofing)
            proxy_set_header X-SSL-Client-Cert "";
            proxy_set_header X-SSL-Client-Verify "";
            proxy_set_header X-SSL-Client-S-DN "";
            proxy_set_header X-SSL-Client-I-DN "";
            proxy_set_header X-SSL-Client-Serial "";
            proxy_set_header X-SSL-Client-Fingerprint "";
            
            # Step 2: Set headers from Nginx SSL variables (trusted source)
            proxy_set_header X-SSL-Client-Cert $ssl_client_cert;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;  # Distinguished Name
            proxy_set_header X-SSL-Client-I-DN $ssl_client_i_dn;  # Issuer DN
            proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
            proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;
            
            # Note: $ssl_client_cert contains the full certificate in PEM format (with newlines)
            # Flask middleware will extract and validate this information
            # 
            # IMPORTANT: The order matters! Clear external headers BEFORE setting new ones.
            # This prevents attackers from spoofing mTLS headers if Nginx is misconfigured.
            
            # Timeouts for large file uploads
            proxy_connect_timeout 5s;
            proxy_send_timeout 1800s;  # 30 minutes for large uploads
            proxy_read_timeout 1800s;  # 30 minutes for large uploads
            
            # Buffer settings for large uploads
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://panel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JavaScript modules in assets/js - CRITICAL: Must come before SPA fallback
        # This location block handles JS/MJS files in /assets/js/ directory
        # This ensures proper MIME type and prevents fallthrough to SPA
        location ~* ^/assets/js/.*\.(js|mjs)$ {
            root /app/frontend/dist;
            
            # CRITICAL: Return 404 if file doesn't exist, don't fall through to SPA
            # This prevents HTML (index.html) from being returned for missing JS files
            try_files $uri =404;
            
            # CRITICAL: Explicitly set MIME type for JavaScript modules
            # This must be set to ensure proper module script handling
            default_type application/javascript;
            add_header Content-Type "application/javascript; charset=utf-8" always;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # Enable gzip
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
        }

        # JavaScript modules - CRITICAL: Must come before SPA fallback
        # This location block handles ALL other JS/MJS files from any path to prevent fallthrough to SPA
        # This ensures browser extensions or external scripts get proper 404s, not HTML responses
        location ~* \.(js|mjs)$ {
            root /app/frontend/dist;
            
            # CRITICAL: Return 404 if file doesn't exist, don't fall through to SPA
            # This prevents HTML (index.html) from being returned for missing JS files
            try_files $uri =404;
            
            # CRITICAL: Explicitly set MIME type for JavaScript modules
            # This must be set to ensure proper module script handling
            default_type application/javascript;
            add_header Content-Type "application/javascript; charset=utf-8" always;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # Enable gzip
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
        }

        # CSS files in assets directory
        location ~* ^/assets/.*\.css$ {
            root /app/frontend/dist;
            try_files $uri =404;
            
            # Explicitly set MIME type for CSS
            default_type text/css;
            add_header Content-Type "text/css; charset=utf-8" always;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # Enable gzip
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Static assets directory (for other Vite build assets)
        # This handles remaining assets like images, fonts, etc.
        location /assets/ {
            root /app/frontend/dist;
            try_files $uri =404;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # Enable gzip
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
        }

        # Static files - serve directly from filesystem (bypass Flask for performance)
        # This includes CSS, images, fonts, and other assets from frontend/dist
        # NOTE: JS/MJS files are handled by the location block above to ensure proper MIME types
        # All static assets are served over HTTPS with HTTP/2 for optimal performance
        location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp|avif)$ {
            root /app/frontend/dist;
            try_files $uri =404;
            
            # Set MIME type based on file extension
            if ($uri ~* \.css$) {
                add_header Content-Type "text/css; charset=utf-8" always;
            }
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000" always;
            
            # Enable gzip for text-based files
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
            
            # Ensure all static assets are served over HTTPS
            # Force HTTPS for any HTTP requests (shouldn't happen due to redirect, but safety measure)
            if ($scheme != "https") {
                return 301 https://$host$request_uri;
            }
        }


        # Internal location for X-Accel-Redirect (authorized file serving)
        # SECURITY: This location is marked 'internal' so it cannot be accessed directly.
        # Only Flask backend can trigger file serving via X-Accel-Redirect header
        # after verifying user permissions. This offloads file I/O from Python workers
        # to Nginx for better performance and scalability.
        location /internal/uploads/ {
            internal;
            alias /app/uploads/;
            
            # Security: Disable directory listing
            autoindex off;
            
            # Let Nginx determine content type from file extension
            # This is more efficient than Flask determining it
        }

        # Uploaded files - serve directly from filesystem (bypass Flask for performance)
        # SECURITY NOTE: In production, Flask routes /uploads/ are disabled (Config.FLASK_ENV == "production").
        # Nginx serves files directly from the filesystem for better performance.
        # IMPORTANT: Sensitive files (user uploads, avatars) should be accessed through authorized
        # endpoints /api/files/<filename> which verify user permissions. This location serves
        # public/product assets that don't require per-user authorization.
        # 
        # Path configuration (CRITICAL - update to match your deployment):
        # Files are stored at project root level: /app/uploads/avatars/ and /app/uploads/products/
        # Use root /app; to serve from project root where uploads directory is located
        location /uploads/ {
            # Serve from project root uploads directory
            # Files are stored at /app/uploads/avatars/ and /app/uploads/products/
            root /app;
            try_files $uri =404;
            
            # Security: Disable directory listing
            autoindex off;
            
            # Cache uploaded files moderately (they may change)
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            
            # Security headers for file downloads
            add_header X-Content-Type-Options nosniff always;
            
            # Enable gzip for text-based files
            gzip_static on;
            
            # Log access for security monitoring
            access_log on;
        }

        # robots.txt - serve before SPA routing
        location = /robots.txt {
            root /app/frontend/dist;
            try_files /robots.txt =404;
            add_header Content-Type text/plain;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Frontend application - SPA routing fallback
        # All non-API requests should return index.html for client-side routing
        location / {
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;
            
            # Don't cache index.html itself (but cache static assets)
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # CSP header for HTML pages (relaxed for debugging)
            add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; style-src 'self' 'unsafe-inline' https: data:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; media-src 'self' https:; worker-src 'self' blob:;" always;
            
            # Cross-Origin-Opener-Policy - only for HTML pages (not for static assets)
            # This prevents browser warnings about untrustworthy origins
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            
            # Enable HTTP/2 for HTML
            # This ensures index.html is served via HTTP/2
            
            # Preload critical resources hints (will be injected by Vite during build)
            # These help browser prioritize critical assets
        }
    }
}
