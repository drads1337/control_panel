events {
    worker_connections 1024;
}

http {
    upstream panel_backend {
        least_conn;
        server panel-app-1:5001 max_fails=3 fail_timeout=30s;
        server panel-app-2:5001 max_fails=3 fail_timeout=30s;
        server panel-app-3:5001 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Logging
    log_format structured_log '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"http_referer":"$http_referer","http_user_agent":"$http_user_agent","request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
    
    access_log /var/log/nginx/access.log structured_log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression - optimized for maximum compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 9; # Maximum compression level for better performance
    gzip_min_length 256; # Lower threshold to compress more files
    gzip_buffers 16 8k; # Buffer settings for better performance
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/xml+rss 
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;
    gzip_disable "msie6";
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Strong HSTS policy (1 year with includeSubDomains and preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # COEP can break some third-party integrations, use "require-corp" only if needed
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    
    # Content Security Policy (CSP)
    # Strict CSP configuration optimized for production
    # Production: Vite generates hashed assets, allowing stricter policy
    # Development: Requires 'unsafe-inline' and 'unsafe-eval' for HMR
    # 
    # Policy breakdown:
    # - default-src 'self': Only allow resources from same origin
    # - script-src: Allow scripts from self, with nonce support for inline scripts (Vite production uses hashes)
    # - style-src: Allow styles from self and inline (needed for Vite, but can be improved with nonces)
    # - img-src: Allow images from self, data URIs, HTTPS, and blob (for user uploads)
    # - font-src: Allow fonts from self and data URIs
    # - connect-src: Allow API calls to self, HTTPS, and WebSocket connections
    # - frame-ancestors 'none': Prevent clickjacking
    # - upgrade-insecure-requests: Force HTTPS
    # - block-all-mixed-content: Block mixed HTTP/HTTPS content
    # - require-trusted-types-for 'script': Enable Trusted Types for XSS protection
    # Note: In production, Vite generates hashed assets, so 'unsafe-inline' can be removed for scripts
    # However, some third-party libraries may require it. Monitor CSP reports to optimize further.
    # For stricter CSP, consider using nonce-based approach or removing 'unsafe-inline' after testing
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content; object-src 'none'; media-src 'self' https:; worker-src 'self' blob:; require-trusted-types-for 'script';" always;

    server {
        listen 80;
        server_name _;
        
        # Redirect HTTP to HTTPS (required for Lighthouse Best Practices)
        return 301 https://$host$request_uri;
    }

    # HTTPS server (if SSL certificates are available)
    server {
        listen 443 ssl http2;
        server_name _;
        
        # HTTP/2 optimizations for better performance
        # These settings ensure all requests are served via HTTP/2
        http2_max_field_size 16k;
        http2_max_header_size 32k;
        http2_max_requests 1000;
        http2_recv_timeout 20s;
        http2_idle_timeout 3m;
        # Enable HTTP/2 push for critical assets (deprecated in Chrome but may help other browsers)
        # http2_push_preload on;
        
        # Ensure HTTP/2 is used for all connections
        # This helps with Lighthouse "Use HTTP/2" audit
        
        # Add COOP header to HTTPS server as well
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # COEP can break some third-party integrations, use "require-corp" only if needed
        # add_header Cross-Origin-Embedder-Policy "require-corp" always;
        
        # Allow large file uploads (up to 5GB for APK files)
        client_max_body_size 5G;

        # SSL configuration - optimized for performance
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # OCSP stapling for better performance
        ssl_stapling on;
        ssl_stapling_verify on;

        # Same location blocks as HTTP server
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://panel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for large file uploads
            proxy_connect_timeout 5s;
            proxy_send_timeout 1800s;  # 30 minutes for large uploads
            proxy_read_timeout 1800s;  # 30 minutes for large uploads
            
            # Buffer settings for large uploads
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        location /api/auth/ {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://panel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files - serve directly from filesystem (bypass Flask for performance)
        # This includes JS, CSS, images, fonts, and other assets from frontend/dist
        # All static assets are served over HTTPS with HTTP/2 for optimal performance
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp|avif)$ {
            root /app/frontend/dist;
            try_files $uri =404;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            
            # Enable gzip for text-based files
            gzip_static on;
            
            # HTTP/2 server push for critical assets (if needed)
            # Note: HTTP/2 push is deprecated in Chrome but may help other browsers
            # http2_push /assets/css/main.css;
            # http2_push /assets/js/main.js;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
            
            # Ensure all static assets are served over HTTPS
            # Force HTTPS for any HTTP requests (shouldn't happen due to redirect, but safety measure)
            if ($scheme != "https") {
                return 301 https://$host$request_uri;
            }
        }

        # Static assets directory (for Vite build assets)
        location /assets/ {
            root /app/frontend/dist;
            try_files $uri =404;
            
            # Cache static files aggressively
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            
            # Enable gzip
            gzip_static on;
            
            # Add CORS headers if needed for CDN
            add_header Access-Control-Allow-Origin "*" always;
            
            # Optimize for HTTP/2
            # Multiple small files benefit from HTTP/2 multiplexing
        }

        # Uploaded files - serve directly from filesystem (bypass Flask for performance)
        # SECURITY NOTE: In production, Flask routes /uploads/ are disabled (Config.FLASK_ENV == "production").
        # Nginx serves files directly from the filesystem for better performance.
        # IMPORTANT: Sensitive files (user uploads, avatars) should be accessed through authorized
        # endpoints /api/files/<filename> which verify user permissions. This location serves
        # public/game assets that don't require per-user authorization.
        # 
        # Path configuration (CRITICAL - update to match your deployment):
        # Files are stored at project root level: /app/uploads/avatars/ and /app/uploads/games/
        # Use root /app; to serve from project root where uploads directory is located
        location /uploads/ {
            # Serve from project root uploads directory
            # Files are stored at /app/uploads/avatars/ and /app/uploads/games/
            root /app;
            try_files $uri =404;
            
            # Security: Disable directory listing
            autoindex off;
            
            # Cache uploaded files moderately (they may change)
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            
            # Security headers for file downloads
            add_header X-Content-Type-Options nosniff always;
            
            # Enable gzip for text-based files
            gzip_static on;
            
            # Log access for security monitoring
            access_log on;
        }

        # robots.txt - serve before SPA routing
        location = /robots.txt {
            root /app/frontend/dist;
            try_files /robots.txt =404;
            add_header Content-Type text/plain;
            expires 1d;
            add_header Cache-Control "public";
        }

        # Frontend application - SPA routing fallback
        # All non-API requests should return index.html for client-side routing
        location / {
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;
            
            # Don't cache index.html itself (but cache static assets)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            
            # Enable HTTP/2 for HTML
            # This ensures index.html is served via HTTP/2
            
            # Preload critical resources hints (will be injected by Vite during build)
            # These help browser prioritize critical assets
        }
    }
}
