# Development docker-compose configuration
# Использование: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Этот файл переопределяет конфигурацию для разработки:
# - Использует Flask dev server с hot reload
# - Монтирует код для автоматической перезагрузки

services:
  api:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      # Dev defaults (override empty defaults from docker-compose.yml).
      # For real deployments, set these via `.env` / environment variables.
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-dev-offline-ticket-secret-change-me-32chars-min}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-dev-token-static-word-change-me-32chars-min}
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        python -c 'from backend.core.app import create_app; app = create_app(); from flask_migrate import upgrade; app.app_context().push(); upgrade(directory=\"backend/migrations\")' || echo 'Migrations may have already been applied' &&
        echo 'Starting Flask development server...' &&
        python -m backend.scripts.run
      "
    # Flask dev server будет перезагружаться при изменении файлов благодаря volume

  celery_worker_default:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-dev-offline-ticket-secret-change-me-32chars-min}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-dev-token-static-word-change-me-32chars-min}
    # Celery workers будут перезагружаться при изменении файлов благодаря volume

  celery_worker_server:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-dev-offline-ticket-secret-change-me-32chars-min}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-dev-token-static-word-change-me-32chars-min}

  celery_worker_keys:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-dev-offline-ticket-secret-change-me-32chars-min}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-dev-token-static-word-change-me-32chars-min}

  flower:
    environment:
      FLASK_ENV: development
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-dev-offline-ticket-secret-change-me-32chars-min}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-dev-token-static-word-change-me-32chars-min}

  # Для фронтенда в режиме разработки лучше запускать Vite dev server локально
  # или использовать volume для dist. Здесь отключаем nginx для dev режима
  nginx:
    profiles:
      - production
    # В dev режиме nginx не нужен, фронтенд запускается через Vite dev server

