services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: panel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-panel}
      POSTGRES_USER: ${POSTGRES_USER:-panel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panel_user} -d ${POSTGRES_DB:-panel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panel_network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: panel_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me_in_production}
    volumes:
      - redis_data:/data
    # Redis is only accessible within Docker network
    # If you need external access, uncomment the ports line and set REDIS_PORT in .env
    # ports:
    #   - "${REDIS_PORT:-6380}:6379"
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - panel_network
    restart: unless-stopped

  # Flask API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel_api
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-panel}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
      
      # Flask
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      
      # Security
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:-}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-}
      PROJECT_MASTER_KEY: ${PROJECT_MASTER_KEY:-}
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      
      # Email (optional)
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Panel}
      
      # Frontend
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PRODUCTION_CORS_ORIGINS: ${PRODUCTION_CORS_ORIGINS:-}
      
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/2
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./backend/uploads:/app/backend/uploads
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - panel_network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database to be ready...' &&
        sleep 5 &&
        echo 'Running database migrations...' &&
        python -c 'from backend.core.app import create_app; app = create_app(); from flask_migrate import upgrade; app.app_context().push(); upgrade()' || echo 'Migrations may have already been applied' &&
        echo 'Starting API server...' &&
        gunicorn -c backend/scripts/gunicorn.conf.py backend.scripts.wsgi:application
      "

  # Celery Worker - Default Queue
  celery_worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel_celery_default
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-panel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-}
      PROJECT_MASTER_KEY: ${PROJECT_MASTER_KEY:-}
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-}
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - panel_network
    restart: unless-stopped
    command: python -m backend.scripts.celery_worker default

  # Celery Worker - Server Tasks Queue
  celery_worker_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel_celery_server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-panel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-}
      PROJECT_MASTER_KEY: ${PROJECT_MASTER_KEY:-}
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-}
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - panel_network
    restart: unless-stopped
    command: python -m backend.scripts.celery_worker server_tasks

  # Celery Worker - Key Tasks Queue
  celery_worker_keys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel_celery_keys
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-panel}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/2
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      TOKEN_STATIC_WORD: ${TOKEN_STATIC_WORD:-}
      PROJECT_MASTER_KEY: ${PROJECT_MASTER_KEY:-}
      OFFLINE_TICKET_SECRET: ${OFFLINE_TICKET_SECRET:-}
      FLASK_ENV: ${FLASK_ENV:-production}
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - panel_network
    restart: unless-stopped
    command: python -m backend.scripts.celery_worker key_tasks

  # Flower - Celery Monitoring (optional)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panel_flower
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-panel_user}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-panel}
      PANEL_MASTER_KEY: ${PANEL_MASTER_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      FLASK_ENV: ${FLASK_ENV:-production}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-change_me_in_production}@redis:6379/2
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-admin:admin}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis
    networks:
      - panel_network
    restart: unless-stopped
    command: celery -A backend.core.celery_app.celery flower --port=5555

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: panel_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Fallback for self-signed certs
      - ./letsencrypt:/etc/letsencrypt:ro  # Let's Encrypt certificates
      - ./letsencrypt/var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - ./letsencrypt/var/www/certbot:/var/www/certbot:ro  # ACME challenge directory
      - ./uploads:/app/uploads:ro
      # Frontend dist is already in the image, but can be overridden
      # - ./frontend/dist:/app/frontend/dist:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    networks:
      - panel_network
    restart: unless-stopped

  # Certbot for Let's Encrypt SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: panel_certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt/var/lib/letsencrypt:/var/lib/letsencrypt
      - ./letsencrypt/var/log/letsencrypt:/var/log/letsencrypt
    networks:
      - panel_network
    # Certbot runs on-demand via scripts, not as a service
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  panel_network:
    driver: bridge

