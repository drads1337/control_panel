name: Snyk Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  snyk-frontend:
    name: Snyk Frontend Scan
    runs-on: ubuntu-latest
    # Only run if SNYK_TOKEN is configured
    if: ${{ secrets.SNYK_TOKEN != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json
        working-directory: ./frontend

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
          wait-for-processing: true

  snyk-backend:
    name: Snyk Backend Scan
    runs-on: ubuntu-latest
    # Only run if SNYK_TOKEN is configured
    if: ${{ secrets.SNYK_TOKEN != '' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=requirements.txt
        working-directory: ./backend

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
          wait-for-processing: true

  snyk-not-configured:
    name: Snyk Not Configured
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN == '' }}
    
    steps:
      - name: Snyk token not configured
        run: |
          echo "⚠️ Snyk token not configured. Skipping Snyk scans."
          echo "To enable Snyk scanning:"
          echo "1. Get your Snyk token from https://app.snyk.io/account"
          echo "2. Add it as a secret named SNYK_TOKEN in your repository settings"
          echo "3. The workflow will automatically run on the next trigger"

