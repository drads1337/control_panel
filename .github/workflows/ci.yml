name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend: Lint, Type Check, Test, Build
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check formatting
        run: npm run format:check

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:run
      
      - name: Generate coverage report
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build:prod
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Backend: Lint, Test
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy
      
      - name: Run Ruff (linter)
        run: ruff check .
      
      - name: Check code formatting with Black
        run: black --check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy
      
      - name: Type check with mypy
        run: mypy . --ignore-missing-imports || true

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Security scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit (Frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
      
      - name: Run npm audit (Root)
        run: npm audit --audit-level=high || true
      
      - name: Run pip-audit (Backend)
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit --desc || true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Security Check (PII and duplicate imports)
        run: npm run security:check

  # IDOR Security Audit
  idor-security-audit:
    name: IDOR Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run IDOR Security Audit
        run: python -m scripts.security_audit_idor
        # Audit must pass - no continue-on-error to ensure security compliance
      
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idor-security-audit-report
          path: backend/docs/SECURITY_AUDIT_IDOR.md
          retention-days: 30
      
      - name: Comment PR with audit results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'backend/docs/SECURITY_AUDIT_IDOR.md';
            
            if (fs.existsSync(path)) {
              const report = fs.readFileSync(path, 'utf8');
              const summary = report.split('SUMMARY')[1]?.split('POTENTIALLY VULNERABLE')[0] || 'No summary available';
              
              const vulnerableCount = (report.match(/File: routes/g) || []).length;
              
              const comment = `## 🔒 IDOR Security Audit Results
              
              ${summary}
              
              **Potentially vulnerable endpoints found:** ${vulnerableCount}
              
              <details>
              <summary>Full audit report</summary>
              
              \`\`\`
              ${report.substring(0, 5000)}
              \`\`\`
              
              </details>
              
              > ⚠️ **Action Required:** Review the full audit report in the artifacts.`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  # E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Database Migration Validation
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check for uncommitted migrations
        run: |
          echo "Checking for uncommitted migration files..."
          # Check if there are any migration files that are not committed
          if git diff --name-only --diff-filter=A HEAD | grep -q "migrations/versions/.*\.py$"; then
            echo "✅ New migration files detected (expected for new migrations)"
          fi
      
      - name: Validate migration syntax
        run: |
          echo "Validating migration file syntax..."
          python -c "
          import sys
          import os
          sys.path.insert(0, '.')
          
          # Check all migration files for syntax errors
          import glob
          migrations = glob.glob('migrations/versions/*.py')
          errors = []
          
          for migration_file in migrations:
              try:
                  with open(migration_file, 'r') as f:
                      compile(f.read(), migration_file, 'exec')
              except SyntaxError as e:
                  errors.append(f'{migration_file}: {e}')
          
          if errors:
              print('❌ Migration syntax errors found:')
              for error in errors:
                  print(f'  {error}')
              sys.exit(1)
          else:
              print(f'✅ All {len(migrations)} migration files have valid syntax')
          "
      
      - name: Test migration upgrade
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test_secret_key_123456789012345678901234567890
        run: |
          echo "Testing migration upgrade..."
          # Initialize database
          python -m backend.scripts.setup_database || true
          
          # Run migrations
          flask db upgrade || alembic upgrade head
          
          echo "✅ Migration upgrade test passed"
      
      - name: Test migration downgrade (if possible)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test_secret_key_123456789012345678901234567890
        continue-on-error: true
        run: |
          echo "Testing migration downgrade..."
          # Try to downgrade one revision and upgrade back
          # This validates that downgrade functions work
          CURRENT_REV=$(flask db current 2>/dev/null | grep -oP '\(.*\)' | tr -d '()' || echo "")
          if [ -n "$CURRENT_REV" ]; then
            echo "Current revision: $CURRENT_REV"
            # Only test if we have a previous revision
            flask db downgrade -1 || echo "⚠️  Cannot downgrade (may be at initial migration)"
            flask db upgrade || echo "⚠️  Upgrade after downgrade failed"
          fi
      
      - name: Check for missing down_revision
        run: |
          echo "Checking migration chain integrity..."
          python -c "
          import sys
          import re
          import glob
          
          migrations = sorted(glob.glob('migrations/versions/*.py'))
          revisions = {}
          
          # Extract revision IDs and down_revisions
          for migration_file in migrations:
              with open(migration_file, 'r') as f:
                  content = f.read()
                  rev_match = re.search(r\"revision\s*=\s*['\\\"]([^'\\\"]+)['\\\"]\", content)
                  down_match = re.search(r\"down_revision\s*=\s*['\\\"]([^'\\\"]+)['\\\"]|down_revision\s*=\s*None\", content)
                  
                  if rev_match:
                      rev_id = rev_match.group(1)
                      down_rev = down_match.group(1) if down_match and 'None' not in down_match.group(0) else None
                      revisions[rev_id] = {
                          'file': migration_file,
                          'down_revision': down_rev
                      }
          
          # Check for broken chain
          broken = []
          for rev_id, info in revisions.items():
              if info['down_revision'] and info['down_revision'] not in revisions:
                  broken.append(f\"{info['file']}: down_revision '{info['down_revision']}' not found\")
          
          if broken:
              print('❌ Broken migration chain detected:')
              for error in broken:
                  print(f'  {error}')
              sys.exit(1)
          else:
              print(f'✅ Migration chain is valid ({len(revisions)} migrations)')
          "
      
      - name: Validate RLS policies in migrations
        continue-on-error: true
        run: |
          echo "Checking for RLS policy creation in migrations..."
          python -c "
          import glob
          import re
          
          migrations = glob.glob('migrations/versions/*.py')
          rls_tables = []
          
          for migration_file in migrations:
              with open(migration_file, 'r') as f:
                  content = f.read()
                  # Look for table creation
                  table_matches = re.findall(r\"op\.create_table\(['\\\"](\w+)['\\\"]\", content)
                  
                  for table in table_matches:
                      # Check if RLS is enabled
                      if 'ENABLE ROW LEVEL SECURITY' in content or 'ALTER TABLE' in content:
                          # Check if RLS policy is created
                          if f'CREATE POLICY' in content or f'policy' in content.lower():
                              continue
                          else:
                              rls_tables.append(f'{migration_file}: Table {table} may need RLS policies')
          
          if rls_tables:
              print('⚠️  Tables created that may need RLS policies:')
              for warning in rls_tables:
                  print(f'  {warning}')
          else:
              print('✅ RLS policy check passed')
          "

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck, frontend-test, frontend-build, backend-lint, backend-typecheck, backend-test, security-scan, idor-security-audit, migration-check]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Type Check: ${{ needs.frontend-typecheck.result }}"
          echo "Frontend Tests: ${{ needs.frontend-test.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Type Check: ${{ needs.backend-typecheck.result }}"
          echo "Backend Tests: ${{ needs.backend-test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "IDOR Security Audit: ${{ needs.idor-security-audit.result }}"
          echo "Migration Check: ${{ needs.migration-check.result }}"
