<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SaaS Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#E2E8F0", // Crisp Silver (Slate 200)
                        "primary-hover": "#CBD5E1", 
                        "background-light": "#F8FAFC", 
                        "background-dark": "#0F1115", // Deep Charcoal/Black
                        "surface-light": "#ffffff",
                        "surface-dark": "#181B21", // Sophisticated Charcoal Panel
                        "border-light": "#e2e8f0",
                        "border-dark": "#2D333B", // Crisp Silver/Steel Grey borders
                        "text-primary-dark": "#F1F5F9", 
                        "text-secondary-dark": "#94A3B8", // Cool Grey
                        "inactive-dark": "#475569", 
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"], 
                        body: ["Outfit", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"], 
                    },
                    boxShadow: {
                        'glow': '0 0 10px rgba(226, 232, 240, 0.1)',
                    }
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-body bg-background-light dark:bg-background-dark text-gray-800 dark:text-text-primary-dark;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-display font-semibold tracking-wide;
            }
        }
        
        .font-mono-numbers {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0F1115;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D333B;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        ::selection {
            background-color: #E2E8F0;
            color: #0F1115;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
